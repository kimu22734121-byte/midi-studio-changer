# main ブランチに変更が入るたびに、テストしてから GitHub Pages に公開する
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 画面から手動でも実行できる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: npm test
      - name: 公開するファイルをまとめる
        # 画面のプログラムは毎回ちがうフォルダ名（v/コミット番号/）に置く。
        # こうするとブラウザに古いプログラムが残っていても、必ず新しいものを読み込む。
        run: |
          SHORT=${GITHUB_SHA::7}
          VERSION="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') ($SHORT)"
          mkdir -p _site/v/$SHORT
          cp -r css src _site/v/$SHORT/
          cp -r soundfonts .nojekyll _site/
          sed -e "s|href=\"css/style.css\"|href=\"v/$SHORT/css/style.css\"|" \
              -e "s|src=\"src/main.js\"|src=\"v/$SHORT/src/main.js\"|" \
              -e "s|<meta name=\"app-version\" content=\"dev\">|<meta name=\"app-version\" content=\"$VERSION\">|" \
              index.html > _site/index.html
          echo "{\"version\": \"$VERSION\"}" > _site/version.json
          grep -q "v/$SHORT/src/main.js" _site/index.html
          grep -q "$SHORT" _site/index.html
          cat _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
