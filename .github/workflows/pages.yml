# main ブランチに変更が入るたびに、テストしてから GitHub Pages に公開する
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 画面から手動でも実行できる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: npm test
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html css src soundfonts .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
